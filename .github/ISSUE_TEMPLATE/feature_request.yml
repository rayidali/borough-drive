name: Feature request
description: Suggest a focused improvement to exploration or development.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this improve?
      description: Describe the player or contributor need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior, affected area, and relevant alternatives.
    validations:
      required: true
